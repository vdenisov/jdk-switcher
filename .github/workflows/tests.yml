name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install every LTS JDK the scripts have to support
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            11
            17
            21
            25
          cache: gradle

      - name: Run tests
        # Gradle 8.5 cannot run on JDK 25, so the build itself is pinned to 21; the scripts under
        # test are separate processes and get exercised against all four versions
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_21_X64 }}
        shell: pwsh
        run: >
          .\gradlew.bat test --no-daemon
          "-Djdk.homes=$env:JAVA_HOME_11_X64,$env:JAVA_HOME_17_X64,$env:JAVA_HOME_21_X64,$env:JAVA_HOME_25_X64"
