name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Groovy ${{ matrix.groovy }}
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        # Oldest still-current line, the common one, and the newest. The scripts use nothing
        # version-specific; this axis exists to catch a new JDK breaking an older Groovy runtime,
        # which is exactly how 4.0.23 stopped working on JDK 25.
        groovy: ['3.0.25', '4.0.33', '5.0.8']

    steps:
      - uses: actions/checkout@v5

      - name: Install every LTS JDK the scripts have to support
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            11
            17
            21
            25
          cache: gradle

      - name: Run tests
        # The build is pinned to 21 for reproducibility; the scripts under test are separate
        # processes and get exercised against all four versions
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_21_X64 }}
        shell: pwsh
        run: >
          .\gradlew.bat test --no-daemon
          "-PgroovyVersion=${{ matrix.groovy }}"
          "-Djdk.homes=$env:JAVA_HOME_11_X64,$env:JAVA_HOME_17_X64,$env:JAVA_HOME_21_X64,$env:JAVA_HOME_25_X64"
