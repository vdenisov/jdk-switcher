plugins {
    id 'groovy'
}

group = 'com.github.vdenisov'
version = '0.1.0'
description = 'Fast JDK version switching for Windows via directory symlinks'

repositories {
    mavenCentral()
}

java {
    // Local runs pin a predictable LTS; the scripts themselves are exercised across the whole
    // 11..25 matrix as separate processes, see the scriptRuntime configuration below
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// Groovy the scripts are run with, override with -PgroovyVersion to test another line.
// The group id changed at Groovy 4, so 3.0.x still lives under org.codehaus.groovy.
def scriptGroovyVersion = findProperty('groovyVersion') ?: '5.0.8'
def scriptGroovyGroup = scriptGroovyVersion.startsWith('3.') ? 'org.codehaus.groovy' : 'org.apache.groovy'

configurations {
    // Kept separate from the Groovy that Spock needs, so the two can move independently
    scriptRuntime
}

dependencies {
    implementation 'org.apache.groovy:groovy-all:5.0.8'

    scriptRuntime "${scriptGroovyGroup}:groovy:${scriptGroovyVersion}"

    testImplementation 'org.spockframework:spock-core:2.4-groovy-5.0'
    testImplementation 'org.apache.groovy:groovy-all:5.0.8'
}

sourceSets {
    main {
        groovy {
            srcDirs = ['.']
            exclude 'src/**'
            exclude 'build/**'
            exclude '.gradle/**'
            exclude '.idea/**'
            exclude '.git/**'
        }
    }
    test {
        groovy {
            srcDirs = ['src/test/groovy']
        }
    }
}

test {
    useJUnitPlatform()

    // Comma-separated JDK homes the scripts are run under; defaults to the test JVM's own
    systemProperty 'jdk.homes', System.getProperty('jdk.homes', '')

    // The scripts are what is under test, so a different Groovy runtime is a different test run.
    // Without this the task stays up to date across -PgroovyVersion changes and silently reports
    // a pass for a version it never executed.
    inputs.files(configurations.scriptRuntime).withPropertyName('scriptRuntime')

    doFirst {
        systemProperty 'script.runtime.classpath', configurations.scriptRuntime.asPath
    }

    testLogging {
        events = ['passed', 'skipped', 'failed']
        exceptionFormat = 'full'
        showStandardStreams = false
    }
}

// Task to display test results summary
tasks.register('testReport') {
    dependsOn test
    doLast {
        println "\n=== Test Results ==="
        def testResults = test.testResultsDir
        if (testResults.exists()) {
            println "Test report available at: ${test.reports.html.entryPoint}"
        }
    }
}
