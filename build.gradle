plugins {
    id 'groovy'
}

group = 'com.github.vdenisov'
version = '0.1.0'
description = 'Fast JDK version switching for Windows via directory symlinks'

repositories {
    mavenCentral()
}

java {
    // Local runs pin a predictable LTS; the scripts themselves are exercised across the whole
    // 11..25 matrix as separate processes, see the scriptRuntime configuration below
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    // Groovy that runs the scripts under test, deliberately separate from the Groovy that Spock
    // needs: 4.0.x cannot load JDK 25 class files (major version 69), and 25 is in the matrix
    scriptRuntime
}

dependencies {
    implementation 'org.apache.groovy:groovy-all:4.0.23'

    scriptRuntime 'org.apache.groovy:groovy:5.0.6'

    testImplementation 'org.spockframework:spock-core:2.3-groovy-4.0'
    testImplementation 'org.apache.groovy:groovy-all:4.0.23'
}

sourceSets {
    main {
        groovy {
            srcDirs = ['.']
            exclude 'src/**'
            exclude 'build/**'
            exclude '.gradle/**'
            exclude '.idea/**'
            exclude '.git/**'
        }
    }
    test {
        groovy {
            srcDirs = ['src/test/groovy']
        }
    }
}

test {
    useJUnitPlatform()

    // Comma-separated JDK homes the scripts are run under; defaults to the test JVM's own
    systemProperty 'jdk.homes', System.getProperty('jdk.homes', '')

    doFirst {
        systemProperty 'script.runtime.classpath', configurations.scriptRuntime.asPath
    }

    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
        showStandardStreams = false
    }
}

// Task to display test results summary
tasks.register('testReport') {
    dependsOn test
    doLast {
        println "\n=== Test Results ==="
        def testResults = test.testResultsDir
        if (testResults.exists()) {
            println "Test report available at: ${test.reports.html.entryPoint}"
        }
    }
}
